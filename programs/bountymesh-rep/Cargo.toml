[package]
name = "bountymesh-rep"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Permissionless reputation registry — open ledger of worker completions/rejections for the BountyMesh ecosystem"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bountymesh-rep-app.workspace = true
sails-rs.workspace = true

[build-dependencies]
bountymesh-rep-app.workspace = true
sails-rs = { workspace = true, features = ["build"] }

[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.1.0"
authors = ["BountyMesh contributors"]
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/winsznx/bountymesh"
license = "MIT"
keywords = ["gear", "sails", "smart-contracts", "wasm", "no-std"]
categories = ["cryptography::cryptocurrencies", "no-std", "wasm"]

[workspace.dependencies]
sails-rs = "0.10.4"
bountymesh-rep-app = { version = "0.1.0", path = "app" }
